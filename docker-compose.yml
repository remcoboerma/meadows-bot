networks:
  meadows:
    driver: bridge
  broker:
    external: true
    name: broker

services:
  meadows-bot:
    # Context is the repo root: pyproject.toml's [tool.uv.sources] points at
    # ../meadows-protocol and ../meadows-client, so the siblings must be part
    # of the build context (see Dockerfile).
    build:
      context: ..
      dockerfile: meadows-bot/Dockerfile
    image: meadows-bot:latest
    restart: unless-stopped
    environment:
      - MEADOWS_SERVER_URL=${MEADOWS_SERVER_URL:-http://localhost:8080}
      - MEADOWS_JWT_TOKEN=${MEADOWS_JWT_TOKEN}
      - BOT_AUTH_ERROR_DISCONNECT_DELAY=${BOT_AUTH_ERROR_DISCONNECT_DELAY:-5}
    networks:
      - meadows
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
